<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050000">
<title>VEYLQRPT ACADEMY — Think Beyond The Code</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;800;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--neon:#ff003c;--neon2:#ff315e;--red-border:rgba(255,0,60,.42);--glass:rgba(15,0,5,.57)}
*{box-sizing:border-box}
html{min-height:100%;background:#050000}
body{margin:0;min-height:100vh;min-height:100svh;background:#050000;color:#fff;font-family:"Rajdhani",sans-serif;overflow-x:hidden}
#matrix{position:fixed;inset:0;width:100%;height:100%;z-index:0;opacity:.68;pointer-events:none}
.bg-vignette{position:fixed;inset:0;z-index:1;pointer-events:none;background:radial-gradient(ellipse at center,transparent 15%,rgba(0,0,0,.62) 100%),radial-gradient(ellipse at 50% 50%,rgba(110,0,22,.18),transparent 70%)}
.scanline{position:fixed;inset:0;z-index:2;pointer-events:none;opacity:.055;background:repeating-linear-gradient(0deg,transparent 0 3px,#fff 4px)}
/* custom crosshair only on mouse devices */
#cursor,#cursor-ring{position:fixed;top:0;left:0;z-index:30;pointer-events:none;transform:translate(-50%,-50%)}
#cursor{width:19px;height:19px}
#cursor:before,#cursor:after{content:"";position:absolute;background:var(--neon);box-shadow:0 0 7px var(--neon)}
#cursor:before{width:1.5px;height:100%;left:50%}
#cursor:after{height:1.5px;width:100%;top:50%}
#cursor-ring{width:38px;height:38px;border:1px solid rgba(255,0,60,.42);border-radius:50%;transition:width .2s,height .2s,border-color .2s}
body.pointer-active #cursor-ring{width:27px;height:27px;border-color:#fff}
/* intro from supplied theme */
#loading-screen{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;justify-content:center;align-items:center;background:radial-gradient(ellipse at center,#160006 0%,#050000 72%);transition:opacity .8s ease,visibility .8s ease}
#loading-screen.hide{opacity:0;visibility:hidden;pointer-events:none}
.loader-orbit{position:absolute;width:230px;height:230px;border:1px solid rgba(255,0,60,.45);border-radius:50%;box-shadow:0 0 35px rgba(255,0,60,.14),inset 0 0 25px rgba(255,0,60,.08);animation:orbit 9s linear infinite}
.loader-orbit:before,.loader-orbit:after{content:"";position:absolute;inset:13px;border:1px dashed rgba(255,0,60,.28);border-radius:50%;transform:rotateX(65deg)}
.loader-orbit:after{inset:29px;transform:rotateY(65deg)}
@keyframes orbit{to{transform:rotate(360deg)}}
.pulse-logo{width:min(190px,54vw);height:auto;position:relative;z-index:1;filter:drop-shadow(0 0 20px var(--neon));animation:pulse-glow 1.5s infinite alternate}
@keyframes pulse-glow{from{transform:scale(.96);filter:drop-shadow(0 0 10px var(--neon));opacity:.85}to{transform:scale(1.04);filter:drop-shadow(0 0 35px var(--neon));opacity:1}}
.loading-text{position:relative;z-index:1;margin-top:2rem;font:700 12px Orbitron,sans-serif;color:var(--neon);letter-spacing:4px;animation:flicker 2s infinite}
.load-track{width:165px;height:2px;background:#ffffff20;margin-top:17px;overflow:hidden}
.load-track i{display:block;height:100%;width:0;background:var(--neon);box-shadow:0 0 12px var(--neon);animation:load 2.2s ease forwards}
@keyframes load{to{width:100%}}
@keyframes flicker{0%,19%,21%,23%,25%,54%,56%,100%{opacity:1}20%,24%,55%{opacity:.18}}
/* main stage */
main{position:relative;z-index:5;min-height:100vh;min-height:100svh;width:100%;display:flex;justify-content:center;align-items:center;padding:38px 18px;perspective:1500px}
.glass-card{position:relative;width:min(680px,96vw);padding:clamp(25px,5vw,48px) clamp(18px,5vw,54px);text-align:center;border-radius:30px;background:linear-gradient(135deg,rgba(255,0,60,.105) 0%,rgba(12,0,4,.83) 48%,rgba(5,0,0,.91) 100%);backdrop-filter:blur(15px) saturate(170%);-webkit-backdrop-filter:blur(15px) saturate(170%);border:1px solid var(--red-border);border-top:1px solid rgba(255,0,60,.72);border-left:1px solid rgba(255,0,60,.62);box-shadow:0 35px 90px rgba(0,0,0,.85),inset 0 0 32px rgba(255,0,60,.13),0 0 35px rgba(255,0,60,.08);transform-style:preserve-3d;transition:transform .16s ease-out;overflow:hidden}
.glass-card:before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(115deg,rgba(255,255,255,.11),transparent 24%,transparent 70%,rgba(255,0,60,.07));}
.glass-card:after{content:"";position:absolute;top:-55%;left:-65%;width:45%;height:210%;pointer-events:none;transform:rotate(28deg);background:linear-gradient(90deg,transparent,rgba(255,255,255,.075),transparent);animation:glass-sheen 8s ease-in-out infinite}
@keyframes glass-sheen{0%,45%{left:-65%}75%,100%{left:130%}}
.card-content{position:relative;z-index:1;transform-style:preserve-3d}
.hacker-wrapper{display:flex;justify-content:center;margin:0 auto 12px;animation:float 6s ease-in-out infinite;transform-style:preserve-3d}
.main-logo{width:min(220px,54vw);height:auto;filter:drop-shadow(0 0 19px rgba(255,0,60,.65));transform:translateZ(70px);animation:breathe 4s ease-in-out infinite,glitch 7s infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-13px)}}
@keyframes breathe{0%,100%{scale:1;filter:drop-shadow(0 0 14px rgba(255,0,60,.55))}50%{scale:1.035;filter:drop-shadow(0 0 28px rgba(255,0,60,.95))}}
@keyframes glitch{0%,95%,97%,100%{translate:0 0;skew:0deg}96%{translate:-3px 0;filter:drop-shadow(0 0 25px #00ffff);transform:translateZ(70px) skewX(-7deg)}98%{translate:3px 0;filter:drop-shadow(0 0 25px var(--neon));transform:translateZ(70px) skewX(7deg)}}
h1{font:900 clamp(2.25rem,7vw,3.5rem)/1 Orbitron,sans-serif;letter-spacing:3px;margin:8px 0 12px;color:#fff;text-shadow:0 0 10px var(--neon),0 0 24px rgba(255,0,60,.72);transform:translateZ(65px)}
.subtitle{font:700 clamp(1.05rem,3.5vw,1.55rem) Rajdhani,sans-serif;letter-spacing:4px;text-transform:uppercase;color:var(--neon2);margin:0 0 11px;text-shadow:0 0 12px rgba(255,0,60,.8);animation:flicker 4s infinite reverse;transform:translateZ(55px)}
.motto{font-size:clamp(1rem,3vw,1.2rem);font-weight:600;color:#d1cbd0;letter-spacing:2px;margin:0 auto 29px;transform:translateZ(45px)}
.motto:after{content:"";display:block;width:55px;height:2px;background:var(--neon);box-shadow:0 0 12px var(--neon);margin:13px auto 0}
.btn-container{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;transform:translateZ(70px)}
.glow-btn,.website-box{position:relative;display:flex;justify-content:center;align-items:center;gap:10px;min-height:53px;padding:12px 14px;border-radius:13px;background:rgba(20,0,5,.48);border:1px solid rgba(255,0,60,.52);color:#fff;text-decoration:none;font:700 13px Orbitron,sans-serif;letter-spacing:.4px;overflow:hidden;box-shadow:0 5px 17px rgba(0,0,0,.5),inset 0 0 13px rgba(255,0,60,.08);transition:transform .28s cubic-bezier(.175,.885,.32,1.275),background .28s,border-color .28s,box-shadow .28s}
.glow-btn:before,.website-box:before{content:"";position:absolute;inset:0;left:-110%;width:100%;background:linear-gradient(90deg,transparent,rgba(255,0,60,.5),transparent);transition:left .6s}
.glow-btn:hover,.website-box:hover{transform:translateY(-5px) scale(1.035);background:rgba(255,0,60,.17);border-color:var(--neon);box-shadow:0 0 24px rgba(255,0,60,.4),inset 0 0 15px rgba(255,0,60,.2);text-shadow:0 0 8px #fff}
.glow-btn:hover:before,.website-box:hover:before{left:110%}
.glow-btn svg,.website-box svg{width:20px;height:20px;flex:none;fill:currentColor}
.website-box{width:100%;margin-top:13px;min-height:55px;transform:translateZ(70px);border-color:rgba(255,0,60,.32);color:#a9a1a5;background:rgba(8,0,3,.55);opacity:.62;cursor:not-allowed;pointer-events:none}
.website-box svg{color:#ff315e}
.footer{font:600 9px Orbitron;letter-spacing:3px;color:#81747a;margin-top:24px;transform:translateZ(35px)}
@media(max-width:600px){main{align-items:flex-start;padding:24px 13px 30px}.glass-card{width:100%;padding:22px 15px 20px;border-radius:24px;margin:auto 0}.main-logo{width:min(185px,52vw)}h1{font-size:clamp(2rem,9vw,2.6rem);letter-spacing:2px}.subtitle{font-size:1.05rem;letter-spacing:2.5px}.motto{margin-bottom:23px}.btn-container{grid-template-columns:1fr;gap:10px}.glow-btn{min-height:49px;font-size:12px}.website-box{margin-top:11px}#cursor,#cursor-ring{display:none}}
@media(min-width:601px) and (max-height:760px){main{align-items:flex-start}.glass-card{margin:auto;padding-top:20px;padding-bottom:22px}.main-logo{width:145px}.motto{margin-bottom:18px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}#loading-screen{display:none}.glass-card{transform:none!important}}
</style>
</head>
<body>
<canvas id="matrix"></canvas><div class="bg-vignette"></div><div class="scanline"></div>
<div id="cursor"></div><div id="cursor-ring"></div>
<div id="loading-screen"><div class="loader-orbit"></div><img src="82323.png" alt="VEYLQRPT" class="pulse-logo"><div class="loading-text">SYSTEM INITIALIZING...</div><div class="load-track"><i></i></div></div>
<main id="stage">
<section class="glass-card" id="glass-card">
<div class="card-content">
<div class="hacker-wrapper"><img src="82323.png" alt="VEYLQRPT Academy hooded hacker emblem" class="main-logo"></div>
<h1>VEYLQRPT</h1>
<div class="subtitle">Cybersecurity Academy</div>
<p class="motto">THINK BEYOND THE CODE</p>
<div class="btn-container">
<a class="glow-btn interactive" href="https://youtube.com/@veylqrpt" target="_blank" rel="noopener noreferrer">

</a>

</a>
<a class="glow-btn interactive" href="https://instagram.com/veylqrpt" target="_blank" rel="noopener noreferrer">
<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 2h10a5 5 0 0 1 5 5v10a5 5 0 0 1-5 5H7a5 5 0 0 1-5-5V7a5 5 0 0 1 5-5Zm0 2.1A2.9 2.9 0 0 0 4.1 7v10a2.9 2.9 0 0 0 2.9 2.9h10a2.9 2.9 0 0 0 2.9-2.9V7A2.9 2.9 0 0 0 17 4.1H7ZM12 7a5 5 0 1 1 0 10 5 5 0 0 1 0-10Zm0 2.1a2.9 2.9 0 1 0 0 5.8 2.9 2.9 0 0 0 0-5.8Zm5.2-3.6a1.2 1.2 0 1 1 0 2.4 1.2 1.2 0 0 1 0-2.4Z"/></svg> Instagram

<div class="website-box" aria-disabled="true" title="Website link disabled">
<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20Zm6.9 9h-3a15.7 15.7 0 0 0-1.3-5.2A8 8 0 0 1 18.9 11ZM12 4.1c.9 1.2 1.6 3.7 1.9 6.9h-3.8c.3-3.2 1-5.7 1.9-6.9ZM9.4 5.8A15.7 15.7 0 0 0 8.1 11h-3a8 8 0 0 1 4.3-5.2ZM5.1 13h3a15.7 15.7 0 0 0 1.3 5.2A8 8 0 0 1 5.1 13Zm6.9 6.9c-.9-1.2-1.6-3.7-1.9-6.9h3.8c-.3 3.2-1 5.7-1.9 6.9Zm2.6-1.7a15.7 15.7 0 0 0 1.3-5.2h3a8 8 0 0 1-4.3 5.2Z"/></svg> Website — Coming Soon
</div>
<div class="footer">VEYLQRPT ACADEMY&nbsp; • &nbsp;THINK BEYOND THE CODE</div>
</div>
</section>
</main>
<script>
(()=> {
 const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
 const loader=document.getElementById("loading-screen");
 function hideLoader(){loader.classList.add("hide");setTimeout(()=>loader.remove(),850)}
 if(reduce)hideLoader();else window.addEventListener("load",()=>setTimeout(hideLoader,2200),{once:true});
 // 3D tilt: disable on touch devices to avoid mobile scroll interference.
 const card=document.getElementById("glass-card"),stage=document.getElementById("stage");
 if(matchMedia("(hover:hover) and (pointer:fine)").matches&&!reduce){
  stage.addEventListener("pointermove",e=>{const r=card.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;card.style.transform=`rotateY(${x*7}deg) rotateX(${-y*7}deg)`});
  stage.addEventListener("pointerleave",()=>{card.style.transition="transform .6s cubic-bezier(.23,1,.32,1)";card.style.transform="rotateY(0) rotateX(0)";setTimeout(()=>card.style.transition="transform .16s ease-out",600)});
 }
 // Custom cursor and eased ring for desktop.
 if(matchMedia("(hover:hover) and (pointer:fine)").matches){
  const dot=document.getElementById("cursor"),ring=document.getElementById("cursor-ring");let mx=innerWidth/2,my=innerHeight/2,rx=mx,ry=my;
  addEventListener("pointermove",e=>{mx=e.clientX;my=e.clientY;dot.style.left=mx+"px";dot.style.top=my+"px"},{passive:true});
  function follow(){rx+=(mx-rx)*.17;ry+=(my-ry)*.17;ring.style.left=rx+"px";ring.style.top=ry+"px";requestAnimationFrame(follow)}follow();
  document.querySelectorAll("a").forEach(a=>{a.addEventListener("mouseenter",()=>document.body.classList.add("pointer-active"));a.addEventListener("mouseleave",()=>document.body.classList.remove("pointer-active"))});
 }

 // Short synthesized cyber-click SFX. Starts only after a real user click/tap.
 let sfxContext;
 function playClickSfx(){
  try{
   const AudioCtx=window.AudioContext||window.webkitAudioContext;
   if(!AudioCtx)return;
   if(!sfxContext)sfxContext=new AudioCtx();
   if(sfxContext.state==="suspended")sfxContext.resume();
   const now=sfxContext.currentTime;
   const osc=sfxContext.createOscillator();
   const gain=sfxContext.createGain();
   const filter=sfxContext.createBiquadFilter();
   osc.type="sine";
   osc.frequency.setValueAtTime(920,now);
   osc.frequency.exponentialRampToValueAtTime(430,now+.075);
   filter.type="lowpass";filter.frequency.setValueAtTime(2600,now);
   gain.gain.setValueAtTime(.0001,now);
   gain.gain.exponentialRampToValueAtTime(.055,now+.008);
   gain.gain.exponentialRampToValueAtTime(.0001,now+.095);
   osc.connect(filter);filter.connect(gain);gain.connect(sfxContext.destination);
   osc.start(now);osc.stop(now+.1);
  }catch(e){/* Optional sound must never block navigation. */}
 }
 document.querySelectorAll(".glow-btn").forEach(button=>{
  button.addEventListener("click",playClickSfx,{passive:true});
 });

 // Matrix rain background from the supplied demo theme, density adapted to screen size.
 const canvas=document.getElementById("matrix"),ctx=canvas.getContext("2d");
 const chars="01<VEYLQRPT>{}[]!@#$%^&*".split("");const font=16;let cols=0,drops=[],w=0,h=0,raf=0,last=0;
 function resize(){const d=Math.min(devicePixelRatio||1,1.5);w=innerWidth;h=innerHeight;canvas.width=w*d;canvas.height=h*d;ctx.setTransform(d,0,0,d,0,0);cols=Math.ceil(w/font);drops=Array.from({length:cols},()=>Math.random()*-80)}
 function draw(t){if(document.hidden){raf=0;return}if(t-last<38){raf=requestAnimationFrame(draw);return}last=t;ctx.fillStyle="rgba(5,0,0,.12)";ctx.fillRect(0,0,w,h);ctx.font=font+"px monospace";
  for(let i=0;i<drops.length;i++){if(Math.random()>.12)continue;const ch=chars[(Math.random()*chars.length)|0],y=drops[i]*font;ctx.fillStyle=Math.random()>.985?"#fff":"rgba(255,0,60,.72)";ctx.shadowColor="#ff003c";ctx.shadowBlur=5;ctx.fillText(ch,i*font,y);ctx.shadowBlur=0;if(y>h&&Math.random()>.975)drops[i]=0;drops[i]+=.65}
  raf=requestAnimationFrame(draw)}
 resize();if(!reduce)raf=requestAnimationFrame(draw);addEventListener("resize",()=>{resize();if(!reduce&&!raf)raf=requestAnimationFrame(draw)},{passive:true});document.addEventListener("visibilitychange",()=>{if(document.hidden){cancelAnimationFrame(raf);raf=0}else if(!reduce&&!raf)raf=requestAnimationFrame(draw)});
})();
</script>
</body>
</html>
